version: '3.8'

services:
  db:
    image: postgres:15
    container_name: uniankieta_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uniankieta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d uniankieta"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: uniankieta_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/uniankieta
      - FRONTEND_URL=http://localhost:5173
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: uniankieta_web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: always

volumes:
  postgres_data: